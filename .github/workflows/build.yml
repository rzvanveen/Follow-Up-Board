name: Build apps

# Runs every time you upload or change files, or when you press "Run workflow" on the Actions tab.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Put the board page inside the app
        run: |
          mkdir -p android/app/src/main/assets
          cp web/index.html android/app/src/main/assets/index.html

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle -p android :app:assembleRelease --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk Follow-Up-Board.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: Follow-Up-Board.apk

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Put the board page inside the app
        shell: bash
        run: cp web/index.html desktop/index.html

      - name: Build installer
        working-directory: desktop
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: desktop/dist/Follow-Up-Board-Setup.exe

  release:
    name: Publish downloads
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Follow-Up Board build ${{ github.run_number }}
          make_latest: true
          body: |
            **Phone:** download Follow-Up-Board.apk on your Android phone and open it to install or update.
            **Windows:** download Follow-Up-Board-Setup.exe and run it.
          files: |
            out/Follow-Up-Board.apk
            out/Follow-Up-Board-Setup.exe
